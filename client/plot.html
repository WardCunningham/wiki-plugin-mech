<html>
  <head>
    <script src="https://cdn.plot.ly/plotly-4.1.1.min.js"></script>
  </head>
  <div id="graph" style="width: 100%; height: 100%"></div>
  <script type="module">
    window.addEventListener('message', event => {
      console.log(event)
      let data = event.data
      let traces = data.traces
      Plotly.newPlot('graph', traces)
    })
  </script>
</html>
